name: Build app store package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate appinfo/info.xml against the app store schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          curl -fsSL -o /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

      - name: Check tag matches app version
        run: |
          APP_VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $APP_VERSION in appinfo/info.xml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build app store archive
        run: |
          rm -rf build
          mkdir -p build/artifacts
          rsync -a ./ build/artifacts/collectives_todos/ \
            --exclude .git \
            --exclude .github \
            --exclude .remember \
            --exclude AGENTS.md \
            --exclude tests \
            --exclude www \
            --exclude build
          tar -czf "collectives_todos-v${APP_VERSION}.tar.gz" -C build/artifacts collectives_todos

      - name: Verify archive structure
        run: |
          tar -tzf "collectives_todos-v${APP_VERSION}.tar.gz" > /tmp/contents.txt
          TOP=$(cut -d/ -f1 /tmp/contents.txt | sort -u)
          if [ "$TOP" != "collectives_todos" ]; then
            echo "::error::Archive must contain exactly one top-level folder 'collectives_todos', got: $TOP"
            exit 1
          fi
          grep -q "^collectives_todos/appinfo/info.xml$" /tmp/contents.txt \
            || { echo "::error::Archive is missing appinfo/info.xml"; exit 1; }
          cat /tmp/contents.txt

      - name: Sign the archive
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > build/collectives_todos.key
          chmod 600 build/collectives_todos.key
          openssl dgst -sha512 -sign build/collectives_todos.key \
            "collectives_todos-v${APP_VERSION}.tar.gz" | openssl base64 \
            > "collectives_todos-v${APP_VERSION}.tar.gz.sig"
          rm build/collectives_todos.key

      - name: Attach archive and signature to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "collectives_todos-v${APP_VERSION}.tar.gz" \
            "collectives_todos-v${APP_VERSION}.tar.gz.sig" \
            --title "Collectives Todos v${APP_VERSION}" \
            --generate-notes

      - name: Publish release to the Nextcloud app store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          if [ -z "$APPSTORE_TOKEN" ]; then
            echo "APPSTORE_TOKEN secret not set - skipping app store publish."
            exit 0
          fi
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/collectives_todos-v${APP_VERSION}.tar.gz"
          PAYLOAD=$(jq -n \
            --arg download "$DOWNLOAD_URL" \
            --rawfile signature "collectives_todos-v${APP_VERSION}.tar.gz.sig" \
            '{download: $download, signature: ($signature | gsub("\\s"; "")), nightly: false}')
          STATUS=$(curl -sS -o /tmp/appstore-response.json -w '%{http_code}' \
            -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Content-Type: application/json" \
            -H "Authorization: Token ${APPSTORE_TOKEN}" \
            -d "$PAYLOAD")
          echo "App store responded with HTTP $STATUS"
          cat /tmp/appstore-response.json
          case "$STATUS" in
            200|201) ;;
            *) echo "::error::Publishing to the app store failed" && exit 1 ;;
          esac
