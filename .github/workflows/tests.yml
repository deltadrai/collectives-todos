name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Boot Nextcloud + Collectives + app (functional harness)
        run: tests/functional/harness.sh up

      - name: Seed fixture collective
        run: tests/functional/harness.sh seed

      - name: Smoke checks (aggregation + reverse sync)
        run: tests/functional/harness.sh smoke

      - name: PHPUnit (Unit + Integration)
        run: tests/run.sh
